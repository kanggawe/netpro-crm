<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fecaca" />
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect x="15" y="15" width="170" height="170" rx="42" fill="url(#bgGrad)" filter="drop-shadow(0 10px 20px rgba(153, 27, 27, 0.4))" />
  
  <!-- Subtle Internal Border -->
  <rect x="16" y="16" width="168" height="168" rx="41" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.3" />

  <!-- Network Core Structure -->
  <!-- Top Node -->
  <circle cx="100" cy="56" r="15" fill="url(#coreGlow)" filter="url(#glowEffect)" />
  <circle cx="100" cy="56" r="8" fill="#dc2626" />

  <!-- Connecting Fiber Lines -->
  <path d="M 100 56 L 60 135 M 100 56 L 140 135 M 60 135 L 140 135 M 100 56 L 100 106 M 100 106 L 60 135 M 100 106 L 140 135" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

  <!-- Center Hub Node -->
  <circle cx="100" cy="106" r="14" fill="#ffffff" />
  <circle cx="100" cy="106" r="7" fill="#991b1b" />

  <!-- Bottom Left Node -->
  <circle cx="60" cy="135" r="15" fill="url(#coreGlow)" filter="url(#glowEffect)" />
  <circle cx="60" cy="135" r="8" fill="#dc2626" />

  <!-- Bottom Right Node -->
  <circle cx="140" cy="135" r="15" fill="url(#coreGlow)" filter="url(#glowEffect)" />
  <circle cx="140" cy="135" r="8" fill="#dc2626" />

  <!-- High-speed Pulse Sparkles -->
  <circle cx="100" cy="80" r="3.5" fill="#ffffff" />
  <circle cx="78" cy="120" r="3" fill="#ffffff" />
  <circle cx="122" cy="120" r="3" fill="#ffffff" />
</svg>
