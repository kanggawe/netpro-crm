<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="femBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c0519" />
      <stop offset="50%" stop-color="#881337" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="femSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
    <linearGradient id="femBlazer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="96" fill="url(#femBg)" />
  <circle cx="100" cy="100" r="95" fill="none" stroke="#f43f5e" stroke-width="3" stroke-opacity="0.8" />

  <!-- Body / Blazer -->
  <path d="M 40 190 C 40 148 70 140 100 140 C 130 140 160 148 160 190 Z" fill="url(#femBlazer)" />
  <!-- Coral Inner Blouse -->
  <polygon points="100,140 85,155 100,180 115,155" fill="#f43f5e" />

  <!-- Neck -->
  <rect x="88" y="118" width="24" height="24" rx="4" fill="url(#femSkin)" />

  <!-- Long Hair (Back) -->
  <path d="M 52 80 C 52 140 60 180 68 190 L 132 190 C 140 180 148 140 148 80 Z" fill="#292524" />

  <!-- Head -->
  <ellipse cx="100" cy="88" rx="32" ry="40" fill="url(#femSkin)" />

  <!-- Elegant Hair (Front & Bangs) -->
  <path d="M 64 82 C 64 50 80 40 100 40 C 122 40 136 50 136 82 C 136 94 130 84 122 70 C 112 56 88 56 78 70 C 70 84 64 94 64 82 Z" fill="#292524" />

  <!-- Eyes & Lashes -->
  <ellipse cx="86" cy="88" rx="3.5" ry="4" fill="#0f172a" />
  <ellipse cx="114" cy="88" rx="3.5" ry="4" fill="#0f172a" />
  <path d="M 80 84 Q 86 80 92 84" stroke="#0f172a" stroke-width="2" fill="none" />
  <path d="M 108 84 Q 114 80 120 84" stroke="#0f172a" stroke-width="2" fill="none" />

  <!-- Pearl Earrings -->
  <circle cx="67" cy="94" r="3.5" fill="#ffffff" />
  <circle cx="133" cy="94" r="3.5" fill="#ffffff" />

  <!-- Warm Smile -->
  <path d="M 92 110 Q 100 116 108 110" stroke="#be123c" stroke-width="2.5" stroke-linecap="round" fill="none" />
</svg>
