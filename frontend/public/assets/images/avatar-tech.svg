  <!-- Tech Safety Helmet / Cap -->
  <path d="M 60 74 C 60 42 78 36 100 36 C 122 36 140 42 140 74 Z" fill="#f59e0b" />
  <path d="M 52 74 Q 100 68 148 74" stroke="#d97706" stroke-width="5" fill="none" stroke-linecap="round" />

  <!-- Eyes -->
  <ellipse cx="86" cy="90" rx="3.5" ry="4" fill="#0f172a" />
  <ellipse cx="114" cy="90" rx="3.5" ry="4" fill="#0f172a" />

  <!-- Confident Smile -->
