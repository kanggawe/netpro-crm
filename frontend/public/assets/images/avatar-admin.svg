<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fbcfe8" />
    </linearGradient>
    <linearGradient id="tieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
  </defs>

  <!-- Circular Profile Background -->
  <circle cx="100" cy="100" r="96" fill="url(#avatarBg)" />
  <circle cx="100" cy="100" r="95" fill="none" stroke="#dc2626" stroke-width="3" stroke-opacity="0.8" />

  <!-- Body / Corporate Blazer -->
  <path d="M 40 190 C 40 148 70 140 100 140 C 130 140 160 148 160 190 Z" fill="url(#suitGrad)" />
  
  <!-- White Shirt Collar -->
  <polygon points="100,150 82,140 92,175" fill="#ffffff" />
  <polygon points="100,150 118,140 108,175" fill="#ffffff" />

  <!-- Crimson Executive Tie -->
  <polygon points="96,150 104,150 106,190 100,195 94,190" fill="url(#tieGrad)" />

  <!-- Neck -->
  <rect x="88" y="118" width="24" height="24" rx="4" fill="url(#skinGrad)" />

  <!-- Head / Face -->
  <ellipse cx="100" cy="88" rx="34" ry="42" fill="url(#skinGrad)" />

  <!-- Modern Hair Style -->
  <path d="M 64 82 C 64 54 80 44 100 44 C 122 44 138 54 138 78 C 138 88 134 84 130 76 C 122 62 108 58 92 62 C 80 65 72 74 66 84 Z" fill="#1e293b" />

  <!-- Eyes & Eyebrows -->
  <ellipse cx="86" cy="88" rx="4" ry="4.5" fill="#0f172a" />
  <ellipse cx="114" cy="88" rx="4" ry="4.5" fill="#0f172a" />
  <circle cx="84.5" cy="86.5" r="1.5" fill="#ffffff" />
  <circle cx="112.5" cy="86.5" r="1.5" fill="#ffffff" />
  <path d="M 78 80 Q 86 76 94 79" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M 106 79 Q 114 76 122 80" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Friendly Executive Smile -->
  <path d="M 91 108 Q 100 115 109 108" stroke="#be123c" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Verified Security Badge Pin on Lapel -->
  <circle cx="138" cy="165" r="9" fill="#dc2626" />
  <path d="M 134 165 L 137 168 L 143 162" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>
